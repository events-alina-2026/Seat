<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Find your name and see your seat light up on the evening seating plan."
    />
    <title>Guest List · Find your seat</title>
    <style>
      :root { color-scheme: dark; --paper: #111310; --panel: #191c17; --ink: #f1eee6; --muted: #a1a597; --line: #30352b; --gold: #dbc38c; }
      * { box-sizing: border-box; }
      html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      button, input { font: inherit; }
      button, summary { -webkit-tap-highlight-color: transparent; }
      .shell { width: min(100%, 520px); min-height: 100svh; margin: auto; padding: 0 24px 24px; display: flex; flex-direction: column; }
      .topbar { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
      .event-name, .event-date { margin: 0; font-size: .65rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
      .event-name { color: var(--gold); }
      .event-date { color: var(--muted); }
      main { flex: 1; padding: 38px 0 28px; }
      .eyebrow { margin: 0 0 13px; color: var(--muted); font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; }
      h1 { margin: 0; font: 400 clamp(3rem, 13vw, 4rem)/1.02 Georgia, serif; letter-spacing: -.05em; }
      h1 em { color: var(--gold); font-weight: 400; }
      .intro { margin: 14px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.6; }
      .finder { margin-top: 28px; }
      label { display: block; margin-bottom: 10px; color: var(--muted); font-size: .65rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
      .input-wrap { position: relative; }
      .search-symbol { position: absolute; top: 50%; left: 19px; width: 15px; height: 15px; border: 1.5px solid var(--muted); border-radius: 50%; transform: translateY(-60%); pointer-events: none; }
      .search-symbol::after { content: ""; position: absolute; right: -4px; bottom: -2px; width: 6px; height: 1.5px; background: var(--muted); transform: rotate(45deg); }
      input { width: 100%; height: 56px; padding: 0 49px; border: 1px solid var(--line); border-radius: 12px; outline: none; color: var(--ink); background: var(--panel); font-size: 16px; }
      input::placeholder { color: #8d9384; }
      input::-webkit-search-cancel-button { display: none; }
      input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px #dbc38c0b; }
      .clear-button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.3rem; }
      .clear-button.visible { display: grid; }
      .clear-button:hover { color: var(--ink); background: #ffffff08; }
      .results { margin-top: 16px; }
      .prompt-state, .empty-state { padding: 18px 0 6px; }
      .state-title { margin: 0 0 7px; font: 400 1.15rem Georgia, serif; }
      .state-copy { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.6; }
      .match-detail { margin: 0 0 6px; color: var(--muted); font-size: .72rem; }
      .match-list { margin: 0; padding: 0; list-style: none; }
      .match { width: 100%; min-height: 75px; padding: 13px 0; display: flex; align-items: center; justify-content: space-between; gap: 18px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; text-align: left; cursor: pointer; }
      .match:hover { background: #dbc38c06; }
      .match-name { font: 400 1.1rem/1.4 Georgia, serif; overflow-wrap: anywhere; }
      .seat { flex: 0 0 58px; padding: 8px; border: 1px solid #dbc38c33; border-radius: 10px; text-align: center; background: #dbc38c08; }
      .seat small { display: block; margin-bottom: 2px; color: var(--muted); font-size: .5rem; letter-spacing: .08em; text-transform: uppercase; }
      .seat strong { color: var(--gold); font: 400 1.35rem Georgia, serif; }
      .confirmation { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
      .confirmed-label { margin: 0 0 6px; color: var(--gold); font-size: .59rem; letter-spacing: .1em; text-transform: uppercase; }
      .confirmed-name { margin: 0; font: 400 1.3rem/1.3 Georgia, serif; overflow-wrap: anywhere; }
      .seat-caption { margin: 7px 0 0; color: var(--muted); font-size: .75rem; }
      .selected-number { flex-shrink: 0; color: var(--gold); font: 400 2.8rem Georgia, serif; }
      .selected-number small { display: block; color: var(--muted); font: 500 .55rem sans-serif; letter-spacing: .08em; text-transform: uppercase; text-align: center; }
      .back-button { min-height: 42px; margin-top: 12px; padding: 8px 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: .78rem; text-underline-offset: 4px; }
      .back-button:hover { color: var(--ink); text-decoration: underline; }
      .layout { margin-top: 26px; padding: 0 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); scroll-margin-top: 16px; }
      .layout summary { min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; list-style: none; font: 400 1.15rem Georgia, serif; }
      .layout summary::-webkit-details-marker { display: none; }
      .layout summary::after { content: "+"; color: var(--muted); font: 400 1.15rem sans-serif; }
      .layout[open] summary::after { content: "−"; }
      .layout-copy { margin: 0 0 6px; color: var(--muted); font-size: .77rem; line-height: 1.5; }
      .layout-copy.selected { color: var(--gold); }
      .venue-map { display: block; width: 100%; height: auto; margin: 8px 0; overflow: visible; }
      .venue-map text { font-family: inherit; }
      .plan-seat { fill: #353c2d; stroke: #778363; stroke-width: .7; transition: fill 180ms ease; }
      .plan-seat.unassigned { fill: #22261e; stroke: #515b43; opacity: .6; }
      .plan-seat.active { fill: #ffe2a0; stroke: #fff4d2; stroke-width: 1.4; filter: url(#seat-glow); }
      .seat-halo { fill: #dbc38c22; stroke: var(--gold); stroke-width: .9; }
      .map-legend { display: flex; justify-content: center; gap: 18px; padding-bottom: 18px; color: var(--muted); font-size: .65rem; }
      .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
      .legend-dot { width: 7px; height: 7px; border-radius: 2px; background: #778363; }
      .legend-dot.yours { background: #ffe2a0; box-shadow: 0 0 9px #dbc38c80; }
      .plan-source { display: inline-block; margin-bottom: 18px; color: var(--muted); font-size: .72rem; text-underline-offset: 4px; }
      footer { padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .68rem; line-height: 1.6; }
      :is(button, summary, a):focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
      .layout:focus { outline: none; }
      body.seat-view-open { overflow: hidden; }
      .seat-dialog { width: min(520px, calc(100% - 24px)); height: min(760px, calc(100dvh - 24px)); max-height: calc(100dvh - 24px); max-width: none; margin: auto; padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); color: var(--ink); overflow: hidden; }
      .seat-dialog[open] { display: flex; flex-direction: column; gap: 12px; }
      .seat-dialog::backdrop { background: #070906dd; backdrop-filter: blur(6px); }
      .seat-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; }
      .seat-dialog-header > div:first-child { min-width: 0; }
      .seat-dialog .confirmed-name { font-size: clamp(1.05rem, 4.5vw, 1.5rem); }
      .seat-dialog .selected-number { font-size: 3.2rem; }
      .seat-dialog-location { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.4; flex-shrink: 0; }
      .seat-dialog-map { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
      .seat-dialog .venue-map { width: 100%; height: 100%; max-height: 100%; margin: 0; overflow: hidden; }
      .seat-dialog .map-legend { flex-shrink: 0; padding: 0; }
      .seat-dialog-back { flex-shrink: 0; min-height: 44px; width: 100%; border: 1px solid #dbc38c45; border-radius: 10px; background: #dbc38c0a; color: var(--gold); cursor: pointer; font-size: .82rem; }
      .seat-dialog-back:hover { background: #dbc38c15; }
      .seat-dialog:focus { outline: none; }
      @media (max-height: 620px) { .seat-dialog { padding: 14px; } .seat-dialog[open] { gap: 8px; } .seat-dialog .selected-number { font-size: 2.4rem; } }
      @media (max-width: 380px) { .shell { padding: 0 18px 20px; } main { padding-top: 30px; } h1 { font-size: 2.9rem; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
    </style>
  </head>

      const input = document.querySelector("#guest-search");
      const results = document.querySelector("#results");
      const clearButton = document.querySelector(".clear-button");
      const layout = document.querySelector(".layout");
      const mapStatus = document.querySelector("#map-status");
      const mapHeading = document.querySelector("#map-heading");
      const mapDescription = document.querySelector("#map-description");
      const marker = document.querySelector("#seat-marker");
      const seatDialog = document.querySelector(".seat-dialog");
      const venueMap = document.querySelector(".venue-map");
      const mapHomeLegend = layout.querySelector(".map-legend");
      const dialogMap = document.querySelector(".seat-dialog-map");
      const defaultDescription = mapDescription.textContent;
      document.querySelector("#guest-count").textContent = guests.length + " guests";

      const normalize = value => value.toLocaleLowerCase("en").normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
      function scoreGuest(guest, query) {
        if (/^\d+$/.test(query)) return guest.number === Number(query) ? 1000 : 0;
        const target = normalize(guest.name);
        if (target === query) return 1000;
        if (target.startsWith(query)) return 800;
        if (target.includes(query)) return 700;
        const words = target.split(/\s+/);
        return query.split(/\s+/).every(word => words.some(part => part.includes(word))) ? 600 : 0;
      }
      function escapeHtml(value) {
        const span = document.createElement("span");
        span.textContent = String(value);
        return span.innerHTML;
      }
      function clearSelectedSeat() {
        document.querySelectorAll(".plan-seat.active").forEach(seat => seat.classList.remove("active"));
        marker.replaceChildren();
        mapHeading.textContent = "Seating plan";
        mapStatus.textContent = "54 seats. The stage is at the top of the map.";
        mapStatus.classList.remove("selected");
        mapDescription.textContent = defaultDescription;
      }
      function seatLocation(number) {
        // Numbering confirmed by the event organizer:
        // 1–27 down the left side; 28–54 down the right side from the stage.
        const side = number <= 27 ? "Left" : "Right";
        const position = number <= 27 ? number : number - 27;
        return side + " table · position " + position + " from the stage";
      }
      function showSeat(guest) {
        clearSelectedSeat();
        const seat = document.querySelector('.plan-seat[data-seat="' + guest.number + '"]');
        if (!seat) return;
        seat.classList.add("active");
        const x = Number(seat.dataset.x);
        const y = Number(seat.dataset.y);
        const badgeX = x + (x < 200 ? 34 : -34);
        marker.innerHTML = '<circle class="seat-halo" cx="' + x + '" cy="' + y + '" r="12"/>' +
          '<line x1="' + x + '" y1="' + y + '" x2="' + badgeX + '" y2="' + y + '" stroke="#dbc38c" stroke-width=".8"/>' +
          '<rect x="' + (badgeX - 13) + '" y="' + (y - 10) + '" width="26" height="20" rx="6" fill="#ffe2a0"/>' +
          '<text x="' + badgeX + '" y="' + (y + 3.5) + '" text-anchor="middle" fill="#111310" font-size="11" font-weight="650">' + guest.number + '</text>';
        mapHeading.textContent = "Your seat";
        mapStatus.textContent = "Seat " + guest.number + " · " + seatLocation(guest.number);
        mapStatus.classList.add("selected");
        mapDescription.textContent = guest.name + ", seat " + guest.number + ". " + seatLocation(guest.number) + ". Your chair is highlighted in gold. " + defaultDescription;
        document.querySelector("#dialog-name").textContent = guest.name;
        document.querySelector("#dialog-number").textContent = guest.number;
        document.querySelector("#dialog-location").textContent = seatLocation(guest.number);
        dialogMap.appendChild(venueMap);
        document.body.classList.add("seat-view-open");
        seatDialog.showModal();
        seatDialog.focus({ preventScroll: true });
      }
      function showPrompt() {
        results.innerHTML = '<div class="prompt-state"><p class="state-copy">Type a name, then tap the seat number to see it on the map.</p></div>';
      }
      function showNoResults() {
        results.innerHTML = '<div class="empty-state"><h2 class="state-title">No guest found</h2><p class="state-copy">Try a first name or surname, or ask the welcome team.</p></div>';
      }
      function selectGuest(guest) {
        showSeat(guest);
      }
      function closeSeatView() {
        if (seatDialog.open) seatDialog.close();
        layout.insertBefore(venueMap, mapHomeLegend);
        document.body.classList.remove("seat-view-open");
        clearSelectedSeat();
      }
      function resetSearch() {
        closeSeatView();
        input.value = "";
        layout.open = false;
        updateResults();
        input.focus();
      }
      function updateResults() {
        clearSelectedSeat();
        const query = normalize(input.value);
        clearButton.classList.toggle("visible", Boolean(input.value));
        if (!query) { showPrompt(); return; }
        const matches = guests.map(guest => ({ guest, score: scoreGuest(guest, query) }))
          .filter(item => item.score > 0)
          .sort((a, b) => b.score - a.score || a.guest.number - b.guest.number);
        if (!matches.length) { showNoResults(); return; }
        results.innerHTML = '<p class="match-detail">' + matches.length + (matches.length === 1 ? ' guest' : ' guests') + ' found · Tap to find your seat</p><ul class="match-list" aria-label="Matching guests">' +
          matches.map(({ guest }) => '<li><button class="match" type="button" data-number="' + guest.number + '" aria-label="' + escapeHtml(guest.name).replace(/"/g, '&quot;') + ', seat ' + guest.number + '. Show on map"><span class="match-name">' + escapeHtml(guest.name) + '</span><span class="seat"><small>Seat</small><strong>' + guest.number + '</strong></span></button></li>').join("") + '</ul>';
        results.querySelectorAll(".match").forEach(button => {
          button.addEventListener("click", () => {
            const guest = guests.find(item => item.number === Number(button.dataset.number));
            if (guest) selectGuest(guest);
          });
        });
      }
      input.addEventListener("input", updateResults);
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          const bestMatch = results.querySelector(".match");
          if (bestMatch) { event.preventDefault(); bestMatch.click(); }
        } else if (event.key === "Escape") { resetSearch(); }
      });
      clearButton.addEventListener("click", resetSearch);
      document.querySelector(".seat-dialog-back").addEventListener("click", resetSearch);
      seatDialog.addEventListener("cancel", event => {
        event.preventDefault();
        closeSeatView();
      });
      showPrompt();
    </script>
